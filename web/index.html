<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<title>Music Quiz Pro</title>
<style>
/* Серебристый «плеер»: корпус с экраном, один фиксированный стиль (без тёмной темы). Размеры в rem: режим ТВ просто увеличивает базовый шрифт. */
:root {
  --page: #2c3e50;
  --silver-light: #f5f7fa;
  --silver-mid: #c3cfe2;
  --silver-dark: #8e9eab;
  --screen: #eef2f3;
  --panel: #ffffff;
  --text: #2c3e50;
  --muted: #6b7a86;
  --accent: #2980b9;
  --accent-soft: #d6e9f8;
  --ok: #1e8e4e;
  --ok-soft: #dcf3e5;
  --bad: #c0392b;
  --bad-soft: #fbe3e0;
  --gold: #ffd700;
  --btn-hi: #ffffff;
  --btn-lo: #dcdcdc;
  --edge: #bbbbbb;
  --sh-d: #bebebe;
  --sh-l: #ffffff;
  --final-a: #2c3e50;
  --final-b: #000000;
  --font: 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif;
  color-scheme: light;
  font-size: 16px;
}
html.mode-tv { font-size: 24px; }
html.mode-mobile { font-size: 15px; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--page);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }

/* ---------- корпус и экран ---------- */
.device {
  width: min(900px, 100%);
  height: min(650px, 100%);
  background: linear-gradient(135deg, var(--silver-light), var(--silver-mid), var(--silver-dark));
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 20px rgba(255,255,255,.8);
  padding: 22px;
  display: flex;
  flex-direction: column;
  border: 2px solid var(--sh-l);
}
.screen {
  position: relative;
  flex: 1;
  min-height: 0;
  background: var(--screen);
  border-radius: 15px;
  border: 1px solid #bdc3c7;
  box-shadow: inset 0 0 10px rgba(0,0,0,.1);
  overflow: hidden;
}
.view {
  position: absolute;
  inset: 0;
  padding: 1.4rem;
  display: flex;
  flex-direction: column;
  gap: .9rem;
  overflow-y: auto;
  scrollbar-width: thin;
}

html.mode-tv body, html.mode-mobile body { padding: 0; }
html.mode-tv .device, html.mode-mobile .device { width: 100%; height: 100%; border-radius: 0; border: 0; }
html.mode-tv .device { padding: 28px; }
html.mode-mobile .device { padding: 8px; }
html.mode-mobile .screen { border-radius: 10px; }
html.mode-mobile .view { padding: 1rem; }
@media (max-width: 640px), (max-height: 520px) {
  body { padding: 0; }
  .device { width: 100%; height: 100%; border-radius: 0; border: 0; padding: 8px; }
  .screen { border-radius: 10px; }
  .view { padding: 1rem; }
}

/* ---------- типографика ---------- */
h1 { font-size: 1.75rem; text-align: center; text-shadow: 1px 1px 0 var(--sh-l); }
h2 { font-size: 1.3rem; text-align: center; }
.subtitle { text-align: center; font-size: .75rem; color: var(--muted); letter-spacing: .2em; margin-top: -.6rem; }
.head { display: flex; flex-direction: column; gap: .6rem; padding-top: .2rem; }

/* ---------- общие кнопки ---------- */
.raised {
  background: linear-gradient(145deg, var(--btn-hi), var(--btn-lo));
  border: 1px solid var(--edge);
  box-shadow: 3px 3px 6px var(--sh-d), -3px -3px 6px var(--sh-l);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.raised:hover { transform: translateY(-2px); box-shadow: 5px 5px 10px var(--sh-d), -5px -5px 10px var(--sh-l); }
.raised:active { transform: none; box-shadow: inset 3px 3px 6px var(--sh-d), inset -3px -3px 6px var(--sh-l); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
html.mode-tv :focus-visible { outline-width: 5px; outline-offset: 5px; }
html.mode-tv .raised:focus-visible { transform: scale(1.03); }

.pill-btn { padding: .55rem 1.3rem; border-radius: 999px; font-size: .8rem; font-weight: 700; }
.primary-btn {
  padding: .65rem 1.6rem; border-radius: 999px; font-size: .9rem; font-weight: 800;
  border: 0; cursor: pointer; color: #fff;
  background: linear-gradient(145deg, #3a9ad9, var(--accent));
  box-shadow: 0 4px 10px rgba(41,128,185,.35);
}
.primary-btn:hover { filter: brightness(1.07); }
.footer { display: flex; justify-content: center; align-items: center; gap: .8rem; flex-wrap: wrap; margin-top: auto; padding-top: .2rem; }

.settings-btn {
  position: absolute; top: .9rem; right: .9rem; z-index: 5;
  width: 2.4rem; height: 2.4rem; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.05rem;
}

/* ---------- старт ---------- */
.genre-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); grid-auto-rows: minmax(5.2rem, 1fr); gap: .9rem; }
.genre-btn { border-radius: 18px; padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem; text-align: left; }
.genre-icon { font-size: 2.1rem; width: 3.7rem; height: 3.7rem; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.g-rock { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.g-pop { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
.g-mix { background: linear-gradient(135deg, #f39c12, #e67e22); }
.g-mine { background: linear-gradient(135deg, #1abc9c, #16a085); }
.genre-title { font-size: 1.1rem; font-weight: 800; }
.genre-desc { font-size: .75rem; color: var(--muted); margin-top: .2rem; }
.status-line { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-size: .7rem; font-weight: 600; color: #8a99a3; }

/* ---------- категории ---------- */
.cat-grid { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(6.5rem, 1fr); gap: .8rem; }
.cat-btn { border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem; padding: .6rem; text-align: center; }
.cat-icon { font-size: 2.1rem; line-height: 1; }
.cat-label { font-size: .85rem; font-weight: 800; }
.cat-count { font-size: .68rem; color: var(--muted); }

/* ---------- настройки ---------- */
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: .8rem; }
.setup-section { background: var(--panel); border-radius: 12px; padding: .8rem; box-shadow: inset 1px 1px 3px rgba(0,0,0,.05); display: flex; flex-direction: column; gap: .55rem; }
.setup-label { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-align: center; }
.seg { display: flex; gap: .45rem; flex-wrap: wrap; }
.seg button {
  flex: 1 1 0; min-width: 0; padding: .5rem .4rem; border-radius: 8px; font-size: .75rem; font-weight: 700;
  background: linear-gradient(145deg, var(--btn-hi), var(--btn-lo)); border: 1px solid var(--edge);
  box-shadow: 2px 2px 4px var(--sh-d), -2px -2px 4px var(--sh-l); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: linear-gradient(145deg, #5fb0e6, var(--accent)); color: #fff; border-color: #2471a3; box-shadow: inset 1px 1px 3px rgba(0,0,0,.2); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .45rem; }
input[type="text"] { width: 100%; padding: .5rem .6rem; border-radius: 8px; border: 1px solid #ccc; font: inherit; font-size: .85rem; background: #fff; color: var(--text); }
.file-pick { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.file-pick label { padding: .5rem 1rem; border-radius: 8px; font-size: .78rem; font-weight: 700; }
.file-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-pick input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 3px; }
.hint { font-size: .7rem; color: var(--muted); }
.file-list { font-size: .72rem; color: var(--muted); max-height: 5.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: .15rem; }
.notice { background: var(--accent-soft); color: #1c5a85; border-radius: 10px; padding: .55rem .8rem; font-size: .8rem; text-align: center; }

/* ---------- игра ---------- */
.game-top { display: flex; flex-direction: column; gap: .5rem; }
.scoreboard { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
.chip { background: #e0e4e7; border-radius: 999px; padding: .3rem .75rem; font-size: .78rem; box-shadow: inset 1px 1px 3px rgba(0,0,0,.1); font-variant-numeric: tabular-nums; }
.chip b { font-weight: 800; }
.chip.turn { background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(41,128,185,.4); }
.progress { display: flex; align-items: center; gap: .6rem; font-size: .72rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 6px; background: #d5dbe0; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.stage { display: flex; gap: 1rem; align-items: center; }
.media { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.cover-box { width: 8.5rem; height: 8.5rem; border-radius: 10px; position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.25);
  background: radial-gradient(circle, #e74c3c 0 13%, #111 14% 16%, #222 17% 30%, #1a1a1a 31% 45%, #262626 46% 60%, #1b1b1b 61% 100%); }
.cover-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover-box.loading::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%); animation: shimmer 1.2s infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.media-note { font-size: .65rem; color: var(--muted); max-width: 8.5rem; text-align: center; }
.track-box { display: flex; flex-direction: column; align-items: center; gap: .45rem; }
.play-btn { width: 4.4rem; height: 4.4rem; border-radius: 50%; font-size: 1.6rem; display: grid; place-items: center; }
.play-btn.on { background: linear-gradient(145deg, #5fb0e6, var(--accent)); color: #fff; }

.question { flex: 1; min-width: 0; background: var(--panel); border: 1px solid #e6e9ec; border-radius: 12px; padding: 1rem 1.1rem; box-shadow: 0 2px 5px rgba(0,0,0,.05); text-align: center; display: flex; flex-direction: column; gap: .35rem; justify-content: center; min-height: 5.5rem; }
.q-kind { font-size: .66rem; font-weight: 800; letter-spacing: .12em; color: var(--accent); }
.q-text { font-size: 1.05rem; line-height: 1.4; font-weight: 600; text-wrap: balance; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
.opt-btn {
  display: flex; align-items: center; gap: .6rem; text-align: left; padding: .7rem .8rem; border-radius: 10px;
  background: linear-gradient(to bottom, #fff, #f0f2f4); border: 1px solid #c9ced3; box-shadow: 0 2px 3px rgba(0,0,0,.08);
  font-size: .88rem; cursor: pointer; min-height: 3.1rem;
}
.opt-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #eaf4fd, #d3e6f7); }
.opt-btn:disabled { cursor: default; }
.opt-key { flex-shrink: 0; width: 1.6rem; height: 1.6rem; border-radius: 6px; display: grid; place-items: center; font-size: .72rem; font-weight: 800; background: #e3e8ec; color: var(--muted); }
.opt-btn.correct { background: var(--ok-soft); border-color: var(--ok); color: #135c33; font-weight: 700; }
.opt-btn.correct .opt-key { background: var(--ok); color: #fff; }
.opt-btn.wrong { background: var(--bad-soft); border-color: var(--bad); color: #8a271d; }
.opt-btn.wrong .opt-key { background: var(--bad); color: #fff; }
.opt-btn.dim { opacity: .55; }

.feedback { text-align: center; font-size: .88rem; font-weight: 700; padding: .5rem .8rem; border-radius: 10px; }
.feedback.ok { background: var(--ok-soft); color: #135c33; }
.feedback.bad { background: var(--bad-soft); color: #8a271d; }

@media (max-width: 640px) {
  .stage { flex-direction: column; }
  .question { width: 100%; }
  .opts { grid-template-columns: 1fr; }
  .cat-grid { grid-auto-rows: minmax(6rem, 1fr); }
}
html.mode-mobile .stage { flex-direction: column; }
html.mode-mobile .question { width: 100%; }
html.mode-mobile .opts { grid-template-columns: 1fr; }

/* ---------- финал ---------- */
.final { background: radial-gradient(circle at center, var(--final-a) 0%, var(--final-b) 100%); color: #fff; align-items: center; justify-content: center; text-align: center; overflow: hidden; z-index: 20; }
.final > *:not(.confetti) { position: relative; z-index: 1; }
.confetti { position: absolute; top: -20px; animation: fall linear forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(var(--fall, 700px)) rotate(720deg); opacity: .3; } }
.trophy { font-size: 4.5rem; animation: bounce 1.5s ease-in-out infinite; filter: drop-shadow(0 0 20px gold); }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.1); } }
.winner-title {
  font-size: 1.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: .15em;
  background: linear-gradient(90deg, #ffd700, #fff3a0, #ffd700, #fff3a0); background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: shine 3s linear infinite, zoomIn 1s ease-out;
}
@keyframes shine { to { background-position: 200% center; } }
@keyframes zoomIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
.winner-name { font-size: 2.1rem; font-weight: 900; text-shadow: 0 0 20px rgba(255,215,0,.8); animation: zoomIn 1.2s ease-out .3s both; overflow-wrap: anywhere; }
.winner-score { font-size: 1.1rem; color: var(--gold); font-weight: 700; animation: zoomIn 1.2s ease-out .5s both; }
.podium { display: flex; justify-content: center; align-items: flex-end; gap: .5rem; margin: 1rem 0 .4rem; animation: zoomIn 1.2s ease-out .7s both; }
.podium-place { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: .6rem .5rem; border-radius: 10px 10px 0 0; width: 6rem; font-weight: 700; }
.p1 { background: linear-gradient(to top, #b8860b, #ffd700); height: 7rem; order: 2; }
.p2 { background: linear-gradient(to top, #757575, #c0c0c0); height: 5.4rem; order: 1; }
.p3 { background: linear-gradient(to top, #8b4513, #cd7f32); height: 4.2rem; order: 3; }
.p4 { background: linear-gradient(to top, #34495e, #5d6d7e); height: 3.2rem; order: 4; }
.podium-medal { font-size: 1.4rem; }
.podium-name { font-size: .72rem; overflow-wrap: anywhere; }
.podium-score { font-size: .66rem; opacity: .9; }
.final-actions { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; margin-top: .8rem; animation: zoomIn 1.2s ease-out 1s both; }
.gold-btn { background: linear-gradient(135deg, #ffd700, #ffed4e); color: #2c3e50; border: 0; padding: .75rem 1.8rem; border-radius: 999px; font-size: .9rem; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; box-shadow: 0 5px 20px rgba(255,215,0,.5); }
.ghost-btn { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); padding: .7rem 1.4rem; border-radius: 999px; font-size: .85rem; font-weight: 800; cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  .confetti { display: none; }
}
</style>
</head>
<body>

<div class="device">
  <main class="screen">

    <!-- СТАРТ -->
    <section class="view" id="v-start">
      <button class="settings-btn raised" data-go="setup" aria-label="Настройки">⚙️</button>
      <div class="head">
        <h1>🎧 Music Quiz</h1>
        <p class="subtitle">GENRES EDITION</p>
      </div>
      <div class="genre-grid">
        <button class="genre-btn raised" data-genre="rock">
          <span class="genre-icon g-rock">🎸</span>
          <span><span class="genre-title">РОК</span><span class="genre-desc" style="display:block">Обложки, история, советский рок, легенды</span></span>
        </button>
        <button class="genre-btn raised" data-genre="pop">
          <span class="genre-icon g-pop">🎤</span>
          <span><span class="genre-title">ПОП</span><span class="genre-desc" style="display:block">Хиты, саундтреки, поп-звёзды</span></span>
        </button>
        <button class="genre-btn raised" data-genre="mix">
          <span class="genre-icon g-mix">🔀</span>
          <span><span class="genre-title">ПЕРЕМЕШАННАЯ</span><span class="genre-desc" style="display:block">Микс рока и попа</span></span>
        </button>
        <button class="genre-btn raised" id="mine-btn">
          <span class="genre-icon g-mine">💿</span>
          <span><span class="genre-title">СВОИ ТРЕКИ</span><span class="genre-desc" style="display:block" id="mine-desc">Загрузите MP3 в настройках и угадывайте на слух</span></span>
        </button>
      </div>
      <div class="status-line">
        <span id="status-players"></span>
        <span id="mode-indicator"></span>
      </div>
    </section>

    <!-- НАСТРОЙКИ -->
    <section class="view" id="v-setup" hidden>
      <h2>⚙️ Настройки</h2>
      <div class="notice" id="setup-notice" hidden></div>
      <div class="setup-grid">
        <div class="setup-section">
          <div class="setup-label">🖥️ РЕЖИМ УСТРОЙСТВА</div>
          <div class="seg" data-setting="device">
            <button data-val="windows">🖥️ Windows</button>
            <button data-val="tv">📺 Android TV</button>
            <button data-val="mobile">📱 Смартфон</button>
          </div>
        </div>
        <div class="setup-section">
          <div class="setup-label">РЕЖИМ ИГРЫ</div>
          <div class="seg" data-setting="mode">
            <button data-val="player">👤 Игроки</button>
            <button data-val="team">👥 Команды</button>
          </div>
        </div>
        <div class="setup-section">
          <div class="setup-label">КОЛИЧЕСТВО УЧАСТНИКОВ</div>
          <div class="seg" data-setting="count">
            <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button><button data-val="4">4</button>
          </div>
        </div>
        <div class="setup-section">
          <div class="setup-label">ВОПРОСОВ ЗА ИГРУ</div>
          <div class="seg" data-setting="perRound">
            <button data-val="10">10</button><button data-val="15">15</button><button data-val="20">20</button>
          </div>
        </div>
        <div class="setup-section">
          <div class="setup-label" id="names-label">ИМЕНА УЧАСТНИКОВ</div>
          <div class="names" id="names"></div>
        </div>
        <div class="setup-section">
          <div class="setup-label">🔊 ЗВУК</div>
          <div class="seg" data-setting="sound">
            <button data-val="on">Включён</button>
            <button data-val="off">Выключен</button>
          </div>
        </div>
        <div class="setup-section" style="grid-column: 1 / -1">
          <div class="setup-label">📂 СВОИ MP3 ДЛЯ РЕЖИМА «СВОИ ТРЕКИ»</div>
          <div class="file-pick">
            <input type="file" id="audio-upload" accept="audio/*" multiple>
            <label for="audio-upload" class="raised">Выбрать файлы</label>
            <span class="hint">Нужно минимум 2 трека. Вариантами ответа станут названия файлов.</span>
          </div>
          <div class="file-list" id="file-list"></div>
        </div>
      </div>
      <div class="footer"><button class="pill-btn raised" data-back>⬅️ Назад</button></div>
    </section>

    <!-- КАТЕГОРИИ -->
    <section class="view" id="v-genre" hidden>
      <h2 id="genre-title"></h2>
      <div class="cat-grid" id="cat-grid"></div>
      <div class="footer"><button class="pill-btn raised" data-back>⬅️ Назад</button></div>
    </section>

    <!-- ИГРА -->
    <section class="view" id="v-game" hidden>
      <div class="game-top">
        <div class="scoreboard" id="scoreboard"></div>
        <div class="progress"><span id="progress-text"></span><span class="bar"><i id="progress-bar"></i></span><span id="cat-name"></span></div>
      </div>
      <div class="stage">
        <div class="media" id="media" hidden>
          <div class="cover-box" id="cover-box"><img id="cover-img" alt="" hidden></div>
          <div class="track-box" id="track-box" hidden>
            <button class="play-btn raised" id="play-btn" aria-label="Слушать">▶</button>
            <span class="media-note" id="track-time">Нажмите, чтобы слушать</span>
          </div>
          <span class="media-note" id="media-note"></span>

/* ===================== звук ===================== */
let actx = null;
function tone(freq, dur, type = 'sine', delay = 0) {
  if (settings.sound !== 'on') return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + delay, osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch (e) {}
}
const soundOk = () => { tone(660, .12); tone(880, .16, 'sine', .1); };
const soundBad = () => tone(180, .25, 'sawtooth');
function fanfare() {
  [523, 659, 784, 1047, 784, 659, 523].forEach((f, i) => tone(f, .3, 'sine', i * .2));
  [523, 659, 784, 1047].forEach(f => tone(f, .9, 'sine', 1.4));
}

  const v = $('v-' + view);
  v.scrollTop = 0;
  const first = v.querySelector('.genre-btn, .cat-btn, .opt-btn, .gold-btn, .seg button');
  if (document.documentElement.classList.contains('mode-tv') && first) first.focus({ preventScroll: true });
}
function goBack() {
  if (current === 'final') { show('start'); return; }
  const to = backTarget[current];
  if (to) { if (to === 'genre' && game && game.cat === 'my_tracks') { show('start'); return; } show(to); }
}

/* ===================== игра ===================== */
function poolFor(cat) {
  if (cat === 'my_tracks') {
    return tracks.map((t, i) => {
      const others = shuffle(tracks.filter((_, j) => j !== i).map(o => o.name)).slice(0, 3);
      return { q: 'Что это за трек?', track: t.url, opts: [t.name, ...others] };
    });
  }
  return (MIXES[cat] || [cat]).flatMap(k => DB[k]);
}

function startGame(cat) {
  if (cat === 'my_tracks' && tracks.length < 2) { openSetup('Чтобы играть «Своими треками», выберите хотя бы 2 MP3-файла.'); return; }
  const questions = shuffle(poolFor(cat).slice()).slice(0, settings.perRound).map(q => {
    const correct = q.opts[0];
    return Object.assign({}, q, { shown: shuffle(q.opts.slice()), correct });
  });
  game = {
    cat, questions, q: 0, turn: 0, answered: false,
    players: Array.from({ length: settings.count }, (_, i) => ({ name: nameOf(i), score: 0, right: 0 }))
  };
  backTarget.game = cat === 'my_tracks' ? 'start' : 'genre';
  show('game');
  renderQuestion();
}

function renderBoard() {
  const sb = $('scoreboard');
  sb.textContent = '';
  game.players.forEach((p, i) => {
    const c = el('span', 'chip' + (i === game.turn ? ' turn' : ''));
    c.appendChild(document.createTextNode((i === game.turn ? '▶ ' : '') + p.name + ': '));
    c.appendChild(el('b', null, String(p.score)));
    sb.appendChild(c);
  });
}

let coverToken = 0;
function loadCover(term) {
  const token = ++coverToken, box = $('cover-box'), img = $('cover-img');
  img.hidden = true; img.removeAttribute('src');
  box.classList.add('loading');
  $('media-note').textContent = '';
  const fail = () => { if (token !== coverToken) return; box.classList.remove('loading'); $('media-note').textContent = 'Обложка не загрузилась — угадайте по описанию'; };
  fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=album&limit=1`)
    .then(r => r.json())
    .then(d => {
      if (token !== coverToken) return;
      const art = d.results && d.results[0] && d.results[0].artworkUrl100;
      if (!art) return fail();
      img.onload = () => { if (token === coverToken) { box.classList.remove('loading'); img.hidden = false; } };
      img.onerror = fail;
      img.src = art.replace('100x100bb', '400x400bb');
    })
    .catch(fail);
}

const player = $('player');
function stopTrack() { player.pause(); $('play-btn').classList.remove('on'); $('play-btn').textContent = '▶'; }
$('play-btn').addEventListener('click', () => {
  if (player.paused) { player.play().catch(() => {}); } else { stopTrack(); }
});
player.addEventListener('play', () => { $('play-btn').classList.add('on'); $('play-btn').textContent = '❚❚'; });
player.addEventListener('pause', () => { $('play-btn').classList.remove('on'); $('play-btn').textContent = '▶'; });
player.addEventListener('timeupdate', () => {
  const s = Math.floor(player.currentTime);
  $('track-time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
});

function renderQuestion() {
  const q = game.questions[game.q], total = game.questions.length;
  game.answered = false;
  renderBoard();
  $('progress-text').textContent = `Вопрос ${game.q + 1} / ${total}`;
  $('progress-bar').style.width = `${(game.q / total) * 100}%`;
  $('cat-name').textContent = CAT_LABELS[game.cat] || '';

  const media = $('media');
  stopTrack();
  if (q.search) {
    media.hidden = false; $('cover-box').hidden = false; $('track-box').hidden = true;
    $('q-kind').textContent = 'УГАДАЙТЕ АЛЬБОМ ПО ОБЛОЖКЕ';
    loadCover(q.search);
  } else if (q.track) {
    media.hidden = false; $('cover-box').hidden = true; $('track-box').hidden = false;
    $('media-note').textContent = '';
    $('q-kind').textContent = 'УГАДАЙТЕ НА СЛУХ';
    player.src = q.track; $('track-time').textContent = 'Нажмите, чтобы слушать';
  } else {
    media.hidden = true; coverToken++;
    $('q-kind').textContent = `ОТВЕЧАЕТ: ${game.players[game.turn].name.toUpperCase()}`;
  }
  if (q.search || q.track) $('q-kind').textContent += ` · ${game.players[game.turn].name.toUpperCase()}`;
  $('q-text').textContent = q.q;

  const box = $('opts');
  box.textContent = '';
  q.shown.forEach((opt, i) => {
    const b = el('button', 'opt-btn');
    b.appendChild(el('span', 'opt-key', String(i + 1)));
    b.appendChild(el('span', null, opt));
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });
  $('feedback').hidden = true;
  $('next-btn').hidden = true;
  if (document.documentElement.classList.contains('mode-tv')) box.firstChild.focus({ preventScroll: true });
}

function answer(i) {
  if (game.answered) return;
  game.answered = true;
  const q = game.questions[game.q], picked = q.shown[i], ok = picked === q.correct;
  const p = game.players[game.turn];
  Array.from($('opts').children).forEach((b, j) => {
    b.disabled = true;
    if (q.shown[j] === q.correct) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb = $('feedback');
  fb.hidden = false;
  if (ok) {
    p.score += 10; p.right++;
    soundOk();
    fb.className = 'feedback ok';
    fb.textContent = `Верно! ${p.name} получает +10` + (game.players.length > 1 ? ' и отвечает дальше' : '');
  } else {
    soundBad();
    fb.className = 'feedback bad';
    const next = game.players[(game.turn + 1) % game.players.length];
    fb.textContent = `Неверно. Правильный ответ: ${q.correct}` + (game.players.length > 1 ? `. Ход переходит к: ${next.name}` : '');
    game.passTurn = true;
  }
  renderBoard();
  $('progress-bar').style.width = `${((game.q + 1) / game.questions.length) * 100}%`;
  const nb = $('next-btn');
  nb.textContent = game.q + 1 < game.questions.length ? 'Дальше ➜' : 'Итоги 🏆';
  nb.hidden = false;
  nb.focus({ preventScroll: true });
  nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

$('next-btn').addEventListener('click', () => {
  if (!game || !game.answered) return;
  if (game.passTurn) { game.turn = (game.turn + 1) % game.players.length; game.passTurn = false; }
  game.q++;
  if (game.q < game.questions.length) renderQuestion(); else showFinal();
});

/* ===================== финал ===================== */
function showFinal() {
  stopTrack();
  const fv = $('v-final');
  fv.textContent = '';
  const sorted = game.players.slice().sort((a, b) => b.score - a.score);
  const top = sorted[0].score, leaders = sorted.filter(p => p.score === top);
  const solo = game.players.length === 1, tie = !solo && leaders.length > 1;

  show('final');
  const fall = fv.clientHeight + 40;
  const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#95e1d3', '#f38181', '#aa96da', '#fcbad3', '#a8e6cf'];
  for (let i = 0; i < 80; i++) {
    const c = el('div', 'confetti'), s = Math.random() * 8 + 6;
    Object.assign(c.style, {
      left: Math.random() * 100 + '%', width: s + 'px', height: s + 'px',
      background: colors[i % colors.length], borderRadius: Math.random() > .5 ? '50%' : '2px',
      animationDuration: (Math.random() * 2 + 2) + 's', animationDelay: Math.random() * 2 + 's'
    });
    c.style.setProperty('--fall', fall + 'px');
    fv.appendChild(c);
  }
  fv.appendChild(el('div', 'trophy', tie ? '🤝' : '🏆'));
  fv.appendChild(el('div', 'winner-title', solo ? 'РЕЗУЛЬТАТ' : tie ? 'НИЧЬЯ!' : 'ПОБЕДИТЕЛЬ!'));
  fv.appendChild(el('div', 'winner-name', leaders.map(p => p.name).join(' и ')));
  fv.appendChild(el('div', 'winner-score', solo
    ? `${top} очков · верных ответов ${sorted[0].right} из ${game.questions.length}`
    : `${top} очков`));

  if (!solo) {
    const podium = el('div', 'podium'), medals = ['🥇', '🥈', '🥉', '🎖️'];
    sorted.forEach((p, i) => {
      const place = el('div', `podium-place p${i + 1}`);
      place.appendChild(el('div', 'podium-medal', medals[i]));
      place.appendChild(el('div', 'podium-name', p.name));
      place.appendChild(el('div', 'podium-score', `${p.score} оч.`));
      podium.appendChild(place);
    });
    fv.appendChild(podium);
  }
  const actions = el('div', 'final-actions');
  const again = el('button', 'gold-btn', '🎵 Играть снова');
  again.addEventListener('click', () => startGame(game.cat));
  const menu = el('button', 'ghost-btn', 'В меню');
  menu.addEventListener('click', () => show('start'));
  actions.append(again, menu);
  fv.appendChild(actions);
  again.focus({ preventScroll: true });
  fanfare();
}

/* ===================== кнопки и клавиатура ===================== */
document.querySelectorAll('[data-genre]').forEach(b => b.addEventListener('click', () => openGenre(b.dataset.genre)));
document.querySelectorAll('[data-go="setup"]').forEach(b => b.addEventListener('click', () => openSetup()));
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', goBack));
$('mine-btn').addEventListener('click', () => startGame('my_tracks'));

// Пульт ТВ: стрелки перемещают фокус к ближайшему элементу в нужную сторону.
function spatialMove(dir) {
  const view = $('v-' + current);
  const items = Array.from(view.querySelectorAll('button:not([disabled]), input, label.raised'))
    .filter(e => e.offsetParent !== null && !(e.tagName === 'INPUT' && e.type === 'file'));
  if (!items.length) return;
  const cur = document.activeElement;
  if (!items.includes(cur)) { items[0].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  items.forEach(e => {
    if (e === cur) return;
    const b = e.getBoundingClientRect(), x = b.left + b.width / 2 - cx, y = b.top + b.height / 2 - cy;
    const main = { left: -x, right: x, up: -y, down: y }[dir];
    const cross = (dir === 'left' || dir === 'right') ? Math.abs(y) : Math.abs(x);
    if (main <= 1) return;
    const score = main + cross * 2;
    if (score < bestScore) { bestScore = score; best = e; }
  });
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
}

document.addEventListener('keydown', e => {
  const typing = e.target.tagName === 'INPUT' && e.target.type === 'text';
  if (e.key === 'Escape' || (e.key === 'Backspace' && !typing) || e.key === 'BrowserBack' || e.key === 'GoBack') {
    e.preventDefault(); goBack(); return;
  }
  if (current === 'game' && !typing && game && !game.answered && /^[1-4]$/.test(e.key)) {
    const b = $('opts').children[Number(e.key) - 1]; if (b) b.click(); return;
  }
  const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (dirs[e.key] && settings.device === 'tv') {
    if (typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    e.preventDefault(); spatialMove(dirs[e.key]);
  }
});

// Кнопка «Назад» Android: true — обработано в игре, false — можно закрыть приложение.
window.mqpBack = () => { if (current === 'start') return false; goBack(); return true; };

/* ===================== запуск ===================== */
applyDevice();
renderStart();
</script>
